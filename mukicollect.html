<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>無機コレクト ダメージ計算</title>
  <style>
    body {
      font-family: sans-serif;
      padding: 15px;
      max-width: 500px;
      margin: 0 auto;
    }
    
    select, input, button {
      font-size: 18px;
      padding: 12px;
      width: 100%;
      box-sizing: border-box;
      margin-top: 5px;
      margin-bottom: 15px;
    }

    button {
      background-color: #2563eb;
      color: white;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }

    #error-msg {
      color: red;
      font-weight: bold;
      margin-bottom: 15px;
    }
  </style>
</head>
<body>

  <h1>無機コレクト 計算ツール</h1>

  <div>
    <label>攻撃キャラ:</label>
    <input type="text" id="attacker" placeholder="例: 水素">
  </div>
  
  <div>
    <label>使う技:</label>
    <input type="text" id="skill" placeholder="例: 炎攻撃">
  </div>
  
  <div>
    <label>受けるキャラ:</label>
    <input type="text" id="defender" placeholder="例: ヘリウム">
  </div>

  <div>
    <label>火力バフ:</label>
    <select id="atk-buff">
      <option value="1.0">通常 (1.0倍)</option>
      <option value="1.25">アップ (1.25倍)</option>
      <option value="0.75">ダウン (0.75倍)</option>
    </select>
  </div>
  
  <div>
    <label>防御バフ:</label>
    <select id="def-buff">
      <option value="1.0">通常 (1.0倍)</option>
      <option value="1.25">アップ (1.25倍)</option>
      <option value="0.75">ダウン (0.75倍)</option>
    </select>
  </div>
  
  <div>
    <label>特性攻撃バフ:</label>
    <input type="number" id="sp-atk-buff" value="1.0" step="0.1">
  </div>
  
  <div>
    <label>特性防御バフ:</label>
    <input type="number" id="sp-def-buff" value="1.0" step="0.1">
  </div>

  <button onclick="calculate()">ダメージ計算</button>

  <div id="error-msg"></div>

  <h2>最終ダメージ: <span id="result-damage" style="color: red;">-</span></h2>

    function calculate() {
      document.getElementById('error-msg').textContent = "";
      document.getElementById('result-damage').textContent = "-";
      document.getElementById('result-percent').textContent = "-";

      const attackerName = document.getElementById('attacker').value.trim();
      const defenderName = document.getElementById('defender').value.trim();
      const skillName = document.getElementById('skill').value.trim();

      const attacker = db.characters.find(c => c.name === attackerName);
      const defender = db.characters.find(c => c.name === defenderName);
      const skill = db.skills.find(s => s.name === skillName);

      if (!attacker) {
        document.getElementById('error-msg').textContent = `攻撃キャラ「${attackerName}」がデータベースにありません。`;
        return;
      }
      if (!skill) {
        document.getElementById('error-msg').textContent = `技「${skillName}」がデータベースにありません。`;
        return;
      }
      if (!defender) {
        document.getElementById('error-msg').textContent = `受けるキャラ「${defenderName}」がデータベースにありません。`;
        return;
      }

      const atkBuff = Number(document.getElementById('atk-buff').value);
      const defBuff = Number(document.getElementById('def-buff').value);
      const spAtkBuff = Number(document.getElementById('sp-atk-buff').value);
      const spDefBuff = Number(document.getElementById('sp-def-buff').value);

      // 物理・魔法の判定
      let atk = 0;
      let def = 0;

      if (skill.type === 'physical') {
        atk = attacker.p_atk;
        def = defender.p_def;
      } else {
        atk = attacker.m_atk;
        def = defender.m_def;
      }

      // 属性相性計算
      let affinityRate = 1.0;
      if (skill.element && skill.element !== 'なし') {
        const elements = skill.element.split('・');
        elements.forEach(elem => {
          if (defender.affinity && defender.affinity[elem] !== undefined) {
            affinityRate *= defender.affinity[elem];
          }
        });
      }

      // ダメージ計算
      const top = Math.pow((atk * atkBuff * skill.multiplier), 2); 
      const bottom = (def * defBuff * 3) + (atk * atkBuff * skill.multiplier); 
      const basePower = top / bottom;

      let finalDamage = basePower * affinityRate * spAtkBuff * spDefBuff;
      finalDamage = Math.floor(finalDamage); 

      let percent = (finalDamage / defender.hp) * 100;
      percent = percent.toFixed(1); 

      document.getElementById('result-damage').textContent = finalDamage;
      document.getElementById('result-percent').textContent = percent;
    }
